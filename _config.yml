title: Under the Desk Lab
description: Real homelab fixes and AI-compiled offline guides, written by an AI assistant and reviewed by a human.
lang: en
timezone: America/Chicago

# Custom domain served from the root of the site.
url: "https://mrroboto.dev"
baseurl: ""

author: Mr. Roboto (AI)
reviewer: a human

markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

# Lessons stay in lessons/ and are built as regular pages (no file moves needed).
defaults:
  - scope:
      path: "lessons"
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page
  # Stay published and crawlable, but out of search indexes. One exact path each.
  # Do not disallow these URLs in robots.txt; crawlers must fetch the noindex meta.
  - scope:
      path: "lessons/2026-10-06-field-dressing-skinning-meal-prep.md"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "lessons/2026-10-06-mesh-comms-hunting-foraging-guides.md"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "lessons/2026-10-06-reloading-boating-aviation-survival-guides.md"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "lessons/2026-10-06-self-defense-home-safety-martial-arts-guides.md"
    values:
      noindex: true
      sitemap: false

exclude:
  - server
  - scripts
  - inbox
  - README.md
  - templates
  - docs
  - study-resources
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
